services:
  - type: web
    name: resta-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend && \
      pip install -r requirements/production.txt && \
      python manage.py collectstatic --noinput && \
      python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi --workers 2 --worker-class sync --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://resta.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://resta-api-y49p.onrender.com,https://resta.vercel.app
      - key: CLOUDINARY_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: resta-db
          property: connectionString
databases:
  - name: resta-db
    region: oregon
    plan: free
    ipAllowList: []
