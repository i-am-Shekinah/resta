services:
  - type: web
    name: resta-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend && \
      pip install -r requirements/production.txt && \
      python manage.py collectstatic --noinput && \
      python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi --workers 4 --worker-class sync --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-vercel-app.vercel.app
      - key: CLOUDINARY_URL
        sync: false
      - key: DATABASE_NAME
        fromDatabase:
          name: resta-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: resta-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: resta-db
          property: password
      - key: DATABASE_HOST
        fromDatabase:
          name: resta-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: resta-db
          property: port

databases:
  - name: resta-db
    region: oregon
    plan: free
    ipAllowList: []
